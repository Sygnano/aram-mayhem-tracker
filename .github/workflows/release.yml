name: Release

# Releases follow the version in the code. Change it in apps/desktop/src-tauri/tauri.conf.json,
# apps/desktop/package.json and apps/desktop/src-tauri/Cargo.toml (all three must agree) and push to
# main: when that version has no release yet, this runs CI, builds the installer, signs the update
# files and creates a **draft** release "v<version>" with the installer, its signature and
# `latest.json`. No tag to push: GitHub creates the tag "v<version>" on the built commit when the
# draft is published. Any other push to main stops after the first job. (A tag made by a workflow
# would not start another workflow, which is why the release is not driven by a tag.)
#
# Nothing reaches users until the draft is published by hand: the update feed is the latest
# *published* release, so publishing is the moment every installed copy can see the new version.
on:
  push:
    branches: [main]
  # To rebuild a version: delete its draft, then run this on main. A published version is never
  # rebuilt; bump the version instead.
  workflow_dispatch:

# One release at a time; a second push while one is building waits rather than racing it.
concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default: only the jobs that look for drafts or create the release get write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Is there something to release? The three version fields must agree, and "v<version>" must have
  # no release yet, draft or published (a draft has no tag until it is published, so the releases
  # are what is checked, not the tags). Write access only to see drafts, which a read-only token
  # cannot; it runs nothing but checkout and `gh`.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The installer, the update feed and the tag must all name the same version, and the updater
      # refuses a signature made for another version (`requireSignedVersion`).
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          cargo=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::The three version fields differ: set the same version in all three."
            exit 1
          fi
          tag="v$conf"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' | grep -qx "$tag"; then
            echo "$tag already has a release (draft or published): nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no release yet: building it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # The same checks as CI, so a red commit cannot ship. Actions are pinned by commit SHA in this
  # workflow because it holds the updater signing key.
  ci:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  windows:
    needs: [version, ci]
    runs-on: windows-latest
    permissions:
      contents: write # creates the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The version comes from rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ needs.version.outputs.tag }}
          # The tag is made on publishing, on the commit that was built (not wherever main is then).
          releaseCommitish: ${{ github.sha }}
          releaseName: ARAM Mayhem Tracker ${{ needs.version.outputs.tag }}
          releaseBody: |
            Download `ARAM Mayhem Tracker_*_x64-setup.exe` below and run it. Installed copies with
            this version or later can update from the app: *Updates*, then *Check for updates*.

            Before installing, read [Before you install](https://github.com/Sygnano/aram-mayhem-tracker#before-you-install):
            with *Manage item sets* on, the app replaces every item page on your account.
          releaseDraft: true
          # Not a pre-release: GitHub's "latest release" (what the update feed follows) skips those.
          prerelease: false
          uploadUpdaterJson: true
