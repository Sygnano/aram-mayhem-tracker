[package]
name = "aramkit-client"
version = "0.1.0"
description = "Client for our aramkit caching service: augment statistics for the offer on screen, with an on-disk last-good copy."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# `raw_value`: the dataset is split into one file per champion without decoding each champion.
serde_json = { workspace = true, features = ["raw_value"] }
# The dataset arrives gzipped and is unpacked here, so its download can report progress.
flate2 = "1"
thiserror.workspace = true
# `gzip`: the service compresses its answers, and the champion bundle is mostly repeated field names.
reqwest = { workspace = true, features = ["gzip"] }
tokio.workspace = true
log.workspace = true

[dev-dependencies]
# `net` and `io-util` for the one-connection stand-in service the fallback tests talk to.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
