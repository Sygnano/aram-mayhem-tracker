[package]
name = "mayhem-vision"
version = "0.1.0"
description = "Screen reading: finds the augment cards by their frames and reads their titles with a bundled OCR model."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mayhem-core.workspace = true
serde.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-normalization = "0.1"
# Pure-Rust ONNX inference for the bundled OCR model: nothing native to install.
tract-onnx = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true
# The screenshot fixtures are JPEG and WebP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
